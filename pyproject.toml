[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "market-jepa"
version = "0.1.0"
description = "Code and analyses to reproduce Towards Financial World Modeling (Merchant et al., NeurIPS 2026)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "accelerate>=1.13.0",
    "chronos-forecasting>=2.3.1",
    "ema-pytorch>=0.7.9",
    "hydra-core>=1.3.2",
    "hydra-submitit-launcher>=1.2.0",
    "ipykernel>=7.2.0",
    "mosaicml-streaming>=0.10.0",
    "nbconvert>=7.17.0",
    "numpy>=2.4.1",
    "omegaconf>=2.3.0",
    "pandas>=2.3.3",
    "pytz>=2025.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "stable-finance[mds]",
    "stable-pretraining",
    "timesfm[torch]>=3.0.1",
    "torch>=2.9.1",
    "torchvision>=0.24.1",
    "tqdm>=4.67.1",
    "transformers>=4.57",
    "wandb>=0.25.0",
]

[tool.hatch.build.targets.wheel]
packages = ["market_jepa"]

[tool.uv.sources]
stable-pretraining = { git = "https://github.com/galilai-group/stable-pretraining.git", rev = "e5c81f6" }
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
# THE SUBMODULE, not the remote. Compute nodes have no GitHub credentials,
# so an SSH git source makes every job depend on a key that is not there. The submodule is
# already pinned at a commit and already rsynced to the cluster with the rest
# of the worktree, so a path source is the same statement made once instead of
# twice: the pointer in .gitmodules IS the version. Needs
# `git submodule update --init` in a fresh clone.
stable-finance = { path = "stable-finance" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
# Without this, a bare `uv run pytest` walks the whole tree and collects the
# two gitignored nested checkouts (market-text-data/, plots/market-129B-...).
# market-text-data/tests/ has an __init__.py, as does tests/, so they collide
# on the package name `tests` -- the nested one wins the import and all 57 of
# our own modules fail to collect with "No module named tests.test_*".
testpaths = ["tests"]
